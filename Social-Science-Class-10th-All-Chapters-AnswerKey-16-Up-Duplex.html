<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Social Science 100 Obj Answer Key</title>

<style>
@page {
  size: A4 portrait;
  margin: 0;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 210mm;
  background: white;
  color: black;
  font-family: Arial, Helvetica, sans-serif;
}

.sheet {
  position: relative;
  width: 210mm;
  height: 297mm;
  overflow: hidden;
  page-break-after: always;
  break-after: page;
}

.sheet:last-child {
  page-break-after: auto;
  break-after: auto;
}

.card {
  position: absolute;

  left: calc(8mm + (var(--col) * 48.5mm));
  top: calc(8mm + (var(--row) * 70.25mm));

  width: 48.5mm;
  height: 70.25mm;

  border: 0.30mm dashed #777;

  padding: 3mm 2.4mm 2.2mm;
  overflow: hidden;
}

/*
  IMPORTANT:
  The BACK page mirrors CARD POSITIONS horizontally.
  The text itself is NOT mirrored.
  This is required for A4 duplex printing
  with "Flip on Long Edge".
*/
.back .card {
  left: calc(8mm + ((3 - var(--col)) * 48.5mm));
}

.title {
  text-align: center;
  font-size: 8pt;
  line-height: 1.05;
  font-weight: 700;
}

.range {
  margin: 1.3mm 0 2mm;
  text-align: center;
  font-size: 6.5pt;
  line-height: 1;
  font-weight: 700;
}

.answer-grid {
  position: relative;
  width: 100%;
  height: 52.5mm;
}

.answer {
  position: absolute;

  left: calc(var(--answer-col) * 20%);
  top: calc(var(--answer-row) * 5.10mm);

  width: 19%;

  font-size: 6.6pt;
  line-height: 1;

  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

@media print {
  .screen-help {
    display: none;
  }
}

@media screen {
  body {
    background: #eee;
  }

  .sheet {
    margin: 8mm auto;
    background: white;
    box-shadow: 0 0 8mm rgba(0,0,0,.12);
  }

  .screen-help {
    position: fixed;
    bottom: 10px;
    left: 10px;

    padding: 8px 10px;

    background: white;
    border: 1px solid #bbb;

    font: 13px Arial;
  }
}
</style>
</head>

<body>

<script>

/* =========================================================
   ONLY CHANGE THESE VALUES
   ========================================================= */

const CHAPTER = "SOC. SCI.";

const CHAPTER_NAME = "100 OBJECTIVES";

/*
   Put the verified answer key here.
   One answer per question.
*/
const KEY = [
  "A", "B", "C", "D", "A", "C", "B", "D", "A", "D",
  "C", "B", "B", "A", "C", "D", "B", "C", "A", "D",
  "C", "A", "B", "D", "C", "D", "A", "B", "C", "B",
  "D", "A", "A", "C", "D", "B", "C", "B", "A", "D",
  "B", "C", "D", "A", "B", "A", "C", "D", "B", "D",
  
  "A", "C", "C", "B", "A", "D", "A", "C", "B", "D",
  "D", "A", "B", "C", "D", "C", "A", "B", "D", "B",
  "C", "A", "A", "D", "C", "B", "D", "A", "B", "C",
  "A", "B", "D", "C", "A", "C", "B", "D", "A", "D",
  "B", "C", "B", "A", "D", "C", "D", "C", "B", "A"
];

/* =========================================================
   DO NOT CHANGE BELOW THIS LINE
   ========================================================= */

const TOTAL = KEY.length;

function makeAnswers(start, end) {
  let html = "";

  for (let q = start; q <= end; q++) {
    const i = q - start;

    html += `
      <span
        class="answer"
        style="
          --answer-col:${i % 5};
          --answer-row:${Math.floor(i / 5)};
        "
      >
        ${q}-${KEY[q - 1]}
      </span>
    `;
  }

  return html;
}

function makeCard(start, end, col, row) {
  return `
    <div
      class="card"
      style="--col:${col};--row:${row};"
    >

      <div class="title">
        ${CHAPTER}
      </div>

      ${
        CHAPTER_NAME
          ? `
            <div
              style="
                text-align:center;
                font-size:5.7pt;
                font-weight:600;
                margin-top:0.8mm;
              "
            >
              ${CHAPTER_NAME}
            </div>
          `
          : ""
      }

      <div class="range">
        ANSWERS ${start}-${end}
      </div>

      <div class="answer-grid">
        ${makeAnswers(start, end)}
      </div>

    </div>
  `;
}

function makePage(start, end, back = false) {

  let html = `
    <section class="sheet ${back ? "back" : ""}">
  `;

  for (let row = 0; row < 4; row++) {

    for (let col = 0; col < 4; col++) {

      html += makeCard(
        start,
        end,
        col,
        row
      );

    }
  }

  html += `
    </section>
  `;

  return html;
}

/*
  For 100 questions:
  Page 1 = 1–50
  Page 2 = 51–100
*/
const split = Math.ceil(TOTAL / 2);

document.write(
  makePage(1, split, false)
);

document.write(
  makePage(split + 1, TOTAL, true)
);

</script>

<div class="screen-help">
  A4 · 100% · Double-sided · Flip on Long Edge
</div>

</body>
</html>
