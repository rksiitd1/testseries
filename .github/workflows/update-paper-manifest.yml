name: Update paper manifest

on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - '*.pdf'
      - 'scripts/build_papers_manifest.py'
      - '.github/workflows/update-paper-manifest.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build manifest
        run: python scripts/build_papers_manifest.py
      - name: Commit manifest if changed
        run: |
          if git diff --quiet -- papers.json; then
            echo "papers.json is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add papers.json
          git commit -m "Update paper manifest"
          git push
