<!doctype html>
<html lang="en">
<head>

  <style>
    :root {

      --ink: #1f2925;
      --sub: #66716b;
      --line: #d8d7ce;
      --line-dark: #b7b9ae;
      --green: #155f48;
      --green-soft: #e6efe9;
      --orange: #b56424;
      --orange-soft: #f7ecdf;
      --blue: #345f77;
      --blue-soft: #e8eff3;
      --shadow: 0 7px 22px rgba(30, 39, 34, .045);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 "Segoe UI", "Nirmala UI", Arial, sans-serif; }
    a { color: inherit; }
    .wrap { width: min(1220px, calc(100% - 44px)); margin-inline: auto; }
    .masthead { padding: 32px 0 23px; border-bottom: 1px solid var(--line); }
    .mast-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
    .brand { display: flex; align-items: center; gap: 10px; font-size: .77rem; font-weight: 850; letter-spacing: .13em; text-transform: uppercase; }
    .brand-mark { display: grid; width: 30px; height: 30px; place-items: center; background: var(--green); color: white; font-size: .78rem; letter-spacing: 0; }
    .header-info { margin-left: auto; text-align: right; }
    h1 { margin: 0 0 7px; font-size: clamp(2.1rem, 5vw, 3.55rem); font-weight: 850; letter-spacing: -.06em; line-height: 1; }
    .archive-period { display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: baseline; gap: 8px 14px; margin: 0; color: var(--sub); font-size: .92rem; }
    .archive-period strong { color: var(--ink); font-weight: 760; }
    .archive-period span { font-weight: 650; }
    .tools { position: sticky; top: 0; z-index: 10; border-bottom: 1px solid var(--line); background: rgba(243,240,232,.96); backdrop-filter: blur(10px); }
    .tools-inner { display: flex; align-items: center; gap: 10px; padding-block: 10px; }
    .search { flex: 1 1 auto; min-width: 160px; height: 40px; padding: 0 12px; border: 1px solid var(--line-dark); border-radius: 2px; background: var(--surface); color: var(--ink); font: inherit; }
    .search:focus, a:focus-visible, summary:focus-visible { outline: 2px solid #669b81; outline-offset: 2px; }
    .jump { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: thin; }
    .jump a { flex: 0 0 auto; padding: 8px 10px; border: 1px solid var(--line); color: var(--sub); font-size: .77rem; font-weight: 700; text-decoration: none; }
    .jump a:hover { border-color: var(--green); color: var(--green); }
    main { padding: 25px 0 50px; }
    .section-title { display: flex; align-items: end; justify-content: space-between; gap: 12px; margin: 0 0 12px; }
    .section-title h2 { margin: 0; font-size: 1.15rem; letter-spacing: -.02em; }
    .section-title p { margin: 0; color: var(--sub); font-size: .8rem; }
    .timeline { display: grid; gap: 9px; }
    .day { display: grid; grid-template-columns: 174px minmax(0, 1fr); border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow); }
    .date-col { display: flex; flex-direction: column; align-items: flex-start; justify-content: center; padding: 17px; border-right: 1px solid var(--line); background: #f8f6f0; }
    .date-month { color: var(--green); font-size: .68rem; font-weight: 850; letter-spacing: .13em; text-transform: uppercase; }
    .date-number { margin-top: 2px; font-size: 2.45rem; font-weight: 760; letter-spacing: -.07em; line-height: 1; }
    .date-weekday { margin-top: 6px; color: var(--sub); font-size: .82rem; font-weight: 700; }
    .today-tag { margin-top: 10px; padding: 3px 7px; background: var(--green); color: white; font-size: .63rem; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; }
    .sessions { min-width: 0; }
    .class-row { display: grid; grid-template-columns: 114px minmax(0,1fr); min-height: 74px; }
    .class-row + .class-row { border-top: 1px solid var(--line); }
    .class-label { display: flex; flex-direction: column; justify-content: center; padding: 12px 14px; border-right: 1px solid var(--line); color: var(--sub); font-size: .69rem; font-weight: 850; letter-spacing: .08em; text-transform: uppercase; }
    .class-label strong { color: var(--ink); font-size: .88rem; letter-spacing: -.01em; text-transform: none; }
    .subject-list { display: grid; gap: 7px; padding: 10px; }
    .subject-card { min-width: 0; padding: 11px 12px; border: 1px solid #e1dfd6; background: #fff; }
    .subject-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 9px; }
    .subject-name { margin: 0; font-size: .92rem; font-weight: 760; }
    .chapter { color: var(--sub); font-size: .75rem; white-space: nowrap; }
    .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
    .action { display: inline-flex; align-items: center; justify-content: center; min-height: 32px; padding: 5px 10px; border: 1px solid var(--green); background: var(--green); color: white; font-size: .75rem; font-weight: 760; text-decoration: none; }
    .action:hover { border-color: #0e4936; background: #0e4936; }
    .action.key { border-color: #a85d21; background: var(--orange); }
    .action.key:hover { border-color: #8e4b17; background: #8e4b17; }
    .action.english { border-color: var(--blue); background: var(--blue); }
    .action.english:hover { border-color: #274b60; background: #274b60; }
    .action.quiet { min-height: 28px; padding: 3px 8px; border-color: var(--line); background: #faf9f5; color: #46534c; font-size: .7rem; }
    .action.quiet:hover { border-color: var(--line-dark); background: var(--green-soft); }
    details.more { margin-top: 8px; color: var(--sub); }
    details.more summary { display: inline-block; cursor: pointer; font-size: .71rem; font-weight: 700; }
    .more-links { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
    .off { display: flex; align-items: center; min-height: 52px; padding: 10px 12px; color: #818981; font-size: .8rem; }
    .off::before { content: ""; width: 5px; height: 5px; margin-right: 9px; background: #c5c9c0; }
    .empty-result { padding: 28px; border: 1px dashed var(--line-dark); color: var(--sub); text-align: center; }
    .unassigned { margin-top: 34px; }
    .unassigned-note { margin: -3px 0 12px; color: var(--sub); font-size: .82rem; }
    .footer { padding: 16px 0 28px; border-top: 1px solid var(--line); color: var(--sub); font-size: .77rem; }
    .footer strong { color: var(--ink); }
    @media (max-width: 760px) {
      .wrap { width: min(100% - 24px, 1220px); }
      .masthead { padding-top: 22px; }
      .day { grid-template-columns: 1fr; }
      .date-col { display: grid; grid-template-columns: auto 1fr auto; align-items: center; column-gap: 10px; padding: 11px 13px; border-right: 0; border-bottom: 1px solid var(--line); }
      .date-month { grid-column: 1; grid-row: 1; font-size: .61rem; }
      .date-number { grid-column: 1; grid-row: 2; margin-top: 0; font-size: 1.65rem; }
      .date-weekday { grid-column: 2; grid-row: 1 / 3; margin: 0; font-size: .9rem; }
      .today-tag { grid-column: 3; grid-row: 1 / 3; margin: 0; }
      .class-row { grid-template-columns: 85px minmax(0,1fr); }
      .class-label { padding-inline: 9px; }
      .subject-list { padding: 7px; }
    }
    @media (max-width: 480px) {
      .wrap { width: calc(100% - 18px); }
      .mast-top { flex-direction: column; align-items: stretch; }
      .header-info { width: 100%; }
      h1 { font-size: 2.2rem; }
      .tools-inner { display: block; }
      .search { width: 100%; }
      .jump { margin-top: 7px; padding-bottom: 2px; }
      .class-row { grid-template-columns: 68px minmax(0,1fr); }
      .class-label { padding: 9px 6px; font-size: .57rem; letter-spacing: .035em; }
      .class-label strong { font-size: .74rem; }
      .subject-card { padding: 9px; }
      .subject-head { align-items: flex-start; }
      .subject-name { font-size: .85rem; }
      .chapter { font-size: .68rem; }
      .action { min-height: 31px; padding-inline: 8px; font-size: .7rem; }
    }
  </style>
</head>

    const jump = document.getElementById('jump');
    for (const day of schedule) {
      const a = document.createElement('a'); a.href = `#day-${day.date}`; a.textContent = `${Number(day.date.slice(-2))} Oct`; jump.append(a);
    }
    function render() {
      const query = document.getElementById('search').value.trim().toLowerCase();
      const timeline = document.getElementById('timeline'); timeline.replaceChildren();
      let shown = 0;
      for (const day of schedule) {
        const entries = [...day.ten.map(x => ({ ...x, classNumber: '10' })), ...day.twelve.map(x => ({ ...x, classNumber: '12' }))];
        const searchable = `${day.date} ${day.weekday} ${entries.map(x => `${x.classNumber} ${x.subject} ${x.chapter}`).join(' ')}`.toLowerCase();
        if (query && !searchable.includes(query)) continue;
        shown++;
        const article = document.createElement('article'); article.className = 'day'; article.id = `day-${day.date}`;
        const date = document.createElement('div'); date.className = 'date-col';
        const month = document.createElement('span'); month.className = 'date-month'; month.textContent = 'October 2026';
        const number = document.createElement('span'); number.className = 'date-number'; number.textContent = Number(day.date.slice(-2));
        const weekday = document.createElement('span'); weekday.className = 'date-weekday'; weekday.textContent = day.weekday;
        date.append(month, number, weekday);
        if (day.today || day.upcoming) { const tag = document.createElement('span'); tag.className = 'today-tag'; tag.textContent = day.upcoming ? 'Tomorrow' : 'Today'; date.append(tag); }
        const sessions = document.createElement('div'); sessions.className = 'sessions';
        sessions.append(sessionRow('10', day.ten), sessionRow('12', day.twelve));
        article.append(date, sessions); timeline.append(article);
      }
      if (!shown) { const empty = document.createElement('div'); empty.className = 'empty-result'; empty.textContent = 'No dates match that search.'; timeline.append(empty); }
    }
    document.getElementById('completed-count').textContent = schedule.reduce((count, day) => count + (day.upcoming ? 0 : day.ten.length + day.twelve.length), 0);
    document.getElementById('search').addEventListener('input', render);
    render();
  </script>
</body>
</html>
